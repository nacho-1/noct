[workspace]
resolver = "2"
members = [
    "noct",
    "common",
    "ebpf",
    "web",
    "config",
    "macros",
    "db",
]
default-members = ["noct", "common"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
axum = { version = "0.8", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.5.20", default-features = false, features = ["std"] }
dotenvy = { version = "0.15", default-features = false }
either = { version = "1.19", default-features = false }
etherparse = { version = "0.21", default-features = false }
figment = { version = "0.10", default-features = false }
hyper = { version = "1.11", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.22", default-features = false }
network-types = { version = "0.2", default-features = false }
prometheus = { version = "0.14", default-features = false }
quote = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
syn = { version = "3.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.40.0", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-panic = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.noct-ebpf]
debug = 2
codegen-units = 1
strip = false
